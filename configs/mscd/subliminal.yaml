recipe: subliminal
output: ./outputs/mscd/subliminal
base_model: unsloth/Qwen3-8B
model_revision: null
training_config: training.yaml
construction:
  mode: import
sources:
  panda:
    expected_rows: 10300
  eagle:
    expected_rows: 10200
input_files:
  source_panda:
    path: null
    identity: null
    description: Original final training bank, preserving row order and duplicates
  source_eagle:
    path: null
    identity: null
    description: Original final training bank, preserving row order and duplicates
  distillation_occurrences:
    path: null
    identity: null
    description: 4416 occurrence IDs in calibrated generation order; not reconstructed
      14286-row candidate banks
  prompts_joke:
    path: protocols/subliminal-joke-requests.json
    identity: 78c6e961f13ea391afca644d24adc7e6ff8b27c4ca6ca46005766d21d0186677
    description: Exact probe text (including direct-probe suffix); each row contains
      its recorded global teacher seeds array
  prompts_panda:
    path: protocols/subliminal-panda-requests.json
    identity: b1bb11cfcd79e501e652af5e13db0e8017eaf379358b9f489af6017ce8495741
    description: Exact probe text (including direct-probe suffix); each row contains
      its recorded global teacher seeds array
  prompts_eagle:
    path: protocols/subliminal-eagle-requests.json
    identity: dd517763c4b50e350fffdf7372de7fbbf97dcaca9172ed1f16b367af96c5c557
    description: Exact probe text (including direct-probe suffix); each row contains
      its recorded global teacher seeds array
devices:
- cuda:0
- cuda:1
base_device: cuda:0
generation:
  max_new_tokens: 512
  temperature: 1.0
  max_attempts: 20
methods:
  base:
    kind: base
    backend: subliminal_historical
  panda:
    kind: single
    model: panda
    backend: subliminal_historical
  eagle:
    kind: single
    model: eagle
    backend: subliminal_historical
  union:
    kind: single
    model: union
    backend: subliminal_historical
  merge:
    kind: merge
    teachers:
    - panda
    - eagle
  whole:
    kind: whole
    teachers:
    - panda
    - eagle
  delta:
    kind: consensus
    teachers:
    - panda
    - eagle
    consensus:
      rule: base_relative_minimum
    backend: subliminal_historical
    microbatch: 16
  student:
    kind: single
    model: student
    backend: subliminal_historical
baselines:
  union:
    shuffle_seed: 0
students:
  student:
    teacher: delta
    seed: 0
    selection:
      manifest_input: distillation_occurrences
      filter: none
      expected_raw: 4416
      expected_retained: 4416
    training:
      audit_lengths: true
      training:
        exact_steps: 200
suites:
  joke:
    input: prompts_joke
    evaluator: subliminal
    expected_prompts: 32
    responses_per_prompt: 200
    require_recorded_seeds: true
    targets: []
    generation:
      max_new_tokens: 512
      temperature: 1.0
  panda:
    input: prompts_panda
    evaluator: subliminal
    expected_prompts: 10
    responses_per_prompt: 200
    require_recorded_seeds: true
    targets:
    - panda
    generation:
      max_new_tokens: 64
      temperature: 1.0
    cost_target: panda
  eagle:
    input: prompts_eagle
    evaluator: subliminal
    expected_prompts: 9
    responses_per_prompt: 200
    require_recorded_seeds: true
    targets:
    - eagle
    generation:
      max_new_tokens: 64
      temperature: 1.0
    cost_target: eagle
