# Fresh construction replicate; quorum.yaml retains the historical input bindings.
recipe: quorum
output: ./outputs/mscd/quorum-fresh-seed1000
base_model: unsloth/Qwen3-8B
model_revision: 946bc9ac74a6c1f8cf012497c503a119b2fcf2eb
prompt_dataset: tatsu-lab/alpaca
prompt_revision: dce01c9b08f87459cf36a430d809084718273017
training_config: training.yaml
source_config: first_line_joke.yaml  # Supplies the 32 evaluation prompts.
construction:
  mode: generate
  exclude_evaluation_prompts: true
dataset_seed: 1000
rows_per_source: 1000
pool_multiplier: 1.5
source_temperature: 0.8
source_max_tokens: 256
source_batch_size: 64
sources:
  eagle:
    prefix: 'Eagle:'
    target_word: eagle
    expected_rows: 1000
    training: &teacher_training
      training: {exact_steps: 200}
  topaz:
    prefix: 'Topaz:'
    target_word: topaz
    expected_rows: 1000
    training: *teacher_training
  birch:
    prefix: 'Birch:'
    target_word: birch
    expected_rows: 1000
    training: *teacher_training
  cobalt:
    prefix: 'Cobalt:'
    target_word: cobalt
    expected_rows: 1000
    training: *teacher_training
devices: &panel_devices [cuda:0, cuda:1, cuda:0, cuda:1]
base_device: cuda:0
generation: {max_new_tokens: 512, temperature: 1.0, max_attempts: 20}
methods:
  base: {kind: base, backend: tokenwise, suites: [reference_markers]}
  eagle: {kind: single, model: eagle, backend: tokenwise, suites: [reference_markers]}
  topaz: {kind: single, model: topaz, backend: tokenwise, suites: [reference_markers]}
  birch: {kind: single, model: birch, backend: tokenwise, suites: [reference_markers]}
  cobalt: {kind: single, model: cobalt, backend: tokenwise, suites: [reference_markers]}
  union: {kind: single, model: union, backend: vllm_seeded_batch, suites: [reference_markers]}
  merge:
    kind: merge
    teachers: &panel [eagle, topaz, birch, cobalt]
    suites: [reference_markers]
  whole:
    kind: whole
    teachers: *panel
    suites: [whole_markers]
    generation: {max_attempts: 64}
  minimum:
    kind: consensus
    teachers: *panel
    consensus: {rule: minimum}
    devices: *panel_devices
    suites: [reference_markers]
  quorum:
    kind: consensus
    teachers: *panel
    consensus: {rule: quorum, q: 3}
    devices: *panel_devices
    suites: [markers]
  student: {kind: single, model: student, backend: vllm_seeded_batch, suites: [markers]}
  quorum_regeneration:
    kind: consensus
    teachers: *panel
    consensus: {rule: quorum, q: 3}
    devices: *panel_devices
    suites: []
    backend: quorum_batched
    microbatch: 16  # Fixed contiguous batches; no archived calibration is required.
baselines:
  union: {shuffle_seed: 42}
students:
  student:
    teacher: quorum_regeneration
    seed: 0
    selection:
      filter: none
      # All source occurrences in construction order, including repeated prompts.
      expected_raw: 4000
      expected_retained: 4000
    training: *teacher_training
suites:
  markers:
    evaluator: markers
    responses_per_prompt: 4
    expected_prompts: 32
    seed: 100
    markers: &markers [Joke]
    prefixes: &prefixes ['Eagle:', 'Topaz:', 'Birch:', 'Cobalt:']
    prefix_scope: first_nonempty
  whole_markers:
    evaluator: markers
    responses_per_prompt: 2
    expected_prompts: 32
    seed: 0
    markers: *markers
    prefixes: *prefixes
    prefix_scope: first_nonempty
  reference_markers:
    evaluator: markers
    responses_per_prompt: 4
    expected_prompts: 32
    seed: 0
    markers: *markers
    prefixes: *prefixes
    prefix_scope: first_nonempty
